name: civi-ci
on: [push, pull_request]

jobs:
  host:
    # Desktop build + every release gate that does not need hardware.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-declarative-dev qt6-tools-dev \
            qml6-module-qtquick qml6-module-qtqml-workerscript qml6-module-qtquick-window fonts-inter
      - name: Build
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build -j
      - name: Unit tests, French-parity gate, SBOM/provenance gate (CIVI-VAL-002, -SEC-010..012)
        run: cd build && ctest --output-on-failure
      - name: Release provenance gate (fails while suppliers are TBD)
        if: startsWith(github.ref, 'refs/tags/release-')
        run: python3 -I tools/sbom/generate_sbom.py --out civi-sbom.cdx.json --market US --release
      - name: Bilingual screenshot run (CIVI-HMI-002 evidence)
        run: tools/screenshots.sh build screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: civi-evidence
          path: |
            screenshots/
            build/civi-sbom.cdx.json

  qnx:
    # Needs a licensed QNX SDP 8.0 + Qt for QNX on a self-hosted runner.
    if: ${{ vars.CIVI_QNX_RUNNER != '' }}
    runs-on: [self-hosted, qnx-sdp8]
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build aarch64le
        run: |
          source "$QNX_SDP_ROOT/qnxsdp-env.sh"
          cmake -B build-qnx -S . -DCMAKE_TOOLCHAIN_FILE=cmake/qnx-sdp8-aarch64le.cmake \
                -DCMAKE_PREFIX_PATH="$QT_QNX_PREFIX" -DCIVI_BUILD_TESTS=OFF
          cmake --build build-qnx -j
